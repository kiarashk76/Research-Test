experiment: supervised
seeds: [0, 1, 2, 3, 4]

network:
  hidden_sizes: [64]
  activation: relu

intervention:
  type: none  # none, fresh, random, dormant, or small_gradient
  reset_fraction: 0.05
  dormant_threshold: 0.01
  interval: 100

artifacts:
  enabled: true
  save_weights: false
  save_gradients: false
  save_activations: false
  max_activation_examples: null

task_data:
  enabled: true
  save_inputs: true
  save_targets: true

analysis:
  latest_eval_mse_by_task: true
  eval_mse_by_eval_step: true
  eval_mse_auc_by_task: true
  steps_to_mse_threshold_by_task:
    enabled: true
    mse_threshold: 0.05
  activation_erank_by_eval_step: true
  dormant_neuron_fraction_by_eval_step:
    enabled: true
    activation_threshold: 0.01

supervised:
  num_inputs: 100
  input_dim: 20
  target_dim: 1
  num_tasks: 100
  steps_per_task: 500
  batch_size: 64
  learning_rate: 0.001
  eval_interval: 25

rl:
  num_states: 20
  obs_dim: 20
  num_actions: 4
  num_tasks: 100
  steps_per_task: 5000
  learning_rate: 0.001
  batch_size: 64
  replay_size: 10000
  gamma: 0.99
  epsilon_start: 0.2
  epsilon_end: 0.05
  target_update_interval: 250
  update_after: 100
  eval_interval: 250
  eval_episodes: 100

output_dir: results
